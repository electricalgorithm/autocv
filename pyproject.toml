[project]
name = "autocv"
version = "0.1.0"
description = "CV markup source, a matching renderer, and an LLM-driven tool that tailors a CV to a job posting"
readme = "README.md"
authors = [
    { name = "Gyokhan Kochmarla", email = "gokhan.kocmarli@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[duckduckgo,google,openai,web-fetch]>=2.33.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.scripts]
autocv = "autocv.cli.main:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.4",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "A",               # flake8-builtins
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "PTH",             # flake8-use-pathlib
    "RET",             # flake8-return
    "ARG",             # flake8-unused-arguments
    "PL",              # pylint
    "RUF",             # ruff-specific
    "D",               # pydocstyle (Google convention)
    "S",               # flake8-bandit
    "BLE",             # flake8-blind-except (no bare `except Exception`)
]
ignore = [
    "D203", "D213",    # conflict with D211/D212 (chosen docstring style)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ARG001", "ARG002", "PLR0913", "PLR0917"]
"src/autocv/cli/**" = ["B008", "PLR0913", "PLR0917"]  # typer commands: one param per CLI option
"**/profile/**" = ["A005"]  # autocv.profile does not shadow stdlib profile when imported

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
